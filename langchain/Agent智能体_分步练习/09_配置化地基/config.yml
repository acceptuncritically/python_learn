# ============================================================
# 第 09 关的配置文件：所有"会变的东西"都放这里，代码里不写死
# ============================================================

# 聊天模型：换成别的模型只改这一行，不用动 main.py
model: deepseek-chat

# 温度：0 最稳定、1 最发散。想看"改配置就生效"可以改成 0.9 对比
temperature: 0.3

# 下面三个都是相对路径，相对的是"本关文件夹"
# path_tool.py 会把它们转成绝对路径，所以从哪个目录运行都不会错
prompt_path: prompts/agent_prompt.txt
records_path: data/records.csv
log_dir: log